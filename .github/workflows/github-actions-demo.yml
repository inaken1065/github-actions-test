name: GitHub Actions Demo
on: [push]
jobs:
  # "my_first_job"というジョブIDでジョブを定義
  my_first_job:
    name: My first job
    runs-on: ubuntu-latest
    steps:
      - name: 最初のメッセージ表示
        run: echo "first job"
  # "my_second_job"というジョブIDでジョブを定義
  my_second_job:
    name: My second job
    runs-on: ubuntu-latest
    steps:
      - name: 二番目のメッセージ表示
        run: echo "second job"
